services:
  - type: web
    name: campusmind-ai-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    initialDeployHook: python -c "from app.nlp.embeddings import get_sentence_transformer; get_sentence_transformer()"
    disk:
      name: campusmind-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusmind-postgres
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: HF_HOME
        value: /var/data/huggingface
      - key: HF_HUB_OFFLINE
        value: "0"
      - key: TRANSFORMERS_OFFLINE
        value: "0"
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_FACULTY_REGISTRATION
        value: "false"

databases:
  - name: campusmind-postgres
    databaseName: campusmind
    user: campusmind
    region: oregon
    plan: 0.5c-1g
    diskSizeGB: 5
